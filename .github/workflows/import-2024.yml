name: Import Revalida 2024
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official 2024 files from INEP
        shell: bash
        run: |
          set -e
          mkdir -p provas/2024/2024-1 provas/2024/2024-2
          page=/tmp/inep.html
          curl -k -L --fail --silent --show-error "https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/revalida/provas-e-gabaritos" -o "$page"
          grep -oE 'https?[^" ]+2024[^" ]+\.pdf' "$page" | sed 's/&amp;/\&/g' | sort -u > /tmp/urls.txt || true
          cat /tmp/urls.txt
          grep -E '2024_1.*(PV|prova)|2024.*1.*(PV|prova)' /tmp/urls.txt | head -n 20 | while read -r u; do
            n=$(basename "$u" | sed 's/[?#].*//')
            curl -k -L --fail --silent --show-error "$u" -o "provas/2024/2024-1/$n" || true
            case "$n" in 2024_1_PV_objetiva_regular.pdf) echo "FOUND 2024/1";; esac
          done
          grep -E '2024_2.*(PV|prova)|2024.*2.*(PV|prova)' /tmp/urls.txt | head -n 20 | while read -r u; do
            n=$(basename "$u" | sed 's/[?#].*//')
            curl -k -L --fail --silent --show-error "$u" -o "provas/2024/2024-2/$n" || true
            case "$n" in 2024_2_PV_objetiva_regular.pdf) echo "FOUND 2024/2";; esac
          done
          find provas/2024 -type f -name '*.pdf' -size +100k -print
          test -n "$(find provas/2024/2024-1 -type f -name '*.pdf' -size +100k -print -quit)"
          test -n "$(find provas/2024/2024-2 -type f -name '*.pdf' -size +100k -print -quit)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provas/2024
          git commit -m "chore: add official Revalida 2024 files" || true
          git push
