name: Import Revalida 2024
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate official 2024 PDFs
        shell: bash
        run: |
          set -e
          mkdir -p provas/2024/2024-1 provas/2024/2024-2
          candidates1=(2024_1_PV_objetiva_regular.pdf 2024_1_PV_objetiva.pdf 2024_1_PV_objetiva_regular_definitivo.pdf)
          candidates2=(2024_2_PV_objetiva_regular.pdf 2024_2_PV_objetiva.pdf 2024_2_PV_objetiva_regular_definitivo.pdf)
          for f in "${candidates1[@]}"; do
            u="https://download.inep.gov.br/revalida/provas_e_gabaritos/$f"
            if curl -L --fail --silent --show-error "$u" -o "provas/2024/2024-1/$f"; then echo "2024/1=$f"; break; fi
            rm -f "provas/2024/2024-1/$f"
          done
          for f in "${candidates2[@]}"; do
            u="https://download.inep.gov.br/revalida/provas_e_gabaritos/$f"
            if curl -L --fail --silent --show-error "$u" -o "provas/2024/2024-2/$f"; then echo "2024/2=$f"; break; fi
            rm -f "provas/2024/2024-2/$f"
          done
          test -n "$(find provas/2024/2024-1 -name '*.pdf' -print -quit)"
          test -n "$(find provas/2024/2024-2 -name '*.pdf' -print -quit)"
          git add provas/2024
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add official Revalida 2024 objective PDFs" || true
          git push
