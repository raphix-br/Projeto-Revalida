name: Import Revalida 2024
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official objective PDFs
        shell: bash
        run: |
          set -e
          mkdir -p provas/2024/2024-1 provas/2024/2024-2
          curl -L --retry 5 --retry-delay 2 --fail --show-error "http://download.inep.gov.br/revalida/provas_e_gabaritos/2024_1_PV_objetiva_regular.pdf" -o provas/2024/2024-1/2024_1_PV_objetiva_regular.pdf
          curl -k -L --fail --show-error "https://download.inep.gov.br/revalida/provas_e_gabaritos/2024_2_PV_objetiva_regular.pdf" -o provas/2024/2024-2/2024_2_PV_objetiva_regular.pdf
          ls -lh provas/2024/2024-1/*.pdf provas/2024/2024-2/*.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provas/2024
          git commit -m "chore: add official Revalida 2024 objective PDFs"
          git push
