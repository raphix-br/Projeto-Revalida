name: Extract Revalida PDF

on:
  push:
    paths:
      - "provas/2025/2025-1/2025_1_PV_objetiva_regular.pdf"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract PDF text
        run: |
          pdftotext -layout "provas/2025/2025-1/2025_1_PV_objetiva_regular.pdf" "provas/2025/2025-1/2025_1_PV_objetiva_regular.txt"
          test -s "provas/2025/2025-1/2025_1_PV_objetiva_regular.txt"

      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "provas/2025/2025-1/2025_1_PV_objetiva_regular.txt"
          git diff --cached --quiet && exit 0
          git commit -m "chore: extract text from Revalida 2025/1 PDF"
          git push
