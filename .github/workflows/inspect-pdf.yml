name: Extract official Revalida text
on:
  push:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Extract PDF text
        run: |
          pdftotext "provas/2025/2025-1/2025_1_PV_objetiva_regular.pdf" "provas/2025/2025-1/2025_1_PV_objetiva_regular_raw.txt"
      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "provas/2025/2025-1/2025_1_PV_objetiva_regular_raw.txt"
          git commit -m "chore: add raw-order extraction of official 2025/1 proof" || exit 0
          git push
