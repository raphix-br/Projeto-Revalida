name: Import Revalida 2025/2 questions
on:
  push:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Extract PDF layout XML
        run: |
          pdftotext -layout "provas/2025/2025-2/2025_2_caderno_1_preliminar.pdf" /tmp/prova.txt
      - name: Reconstruct questions
        run: python3 scripts/reconstruct_revalida_2025_2.py
      - name: Commit extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "provas/2025/2025-2/2025_2_questions_raw.json"
          git commit -m "chore: reconstruct official 2025/2 questions" || exit 0
          git push
