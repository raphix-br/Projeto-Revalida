<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edição · Projeto Revalida</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2e;--panel2:#10233a;--line:#1d3553;--text:#eef5ff;--muted:#9bb0c8;--accent:#62b5ff;--red:#ff7186}*{box-sizing:border-box}html{min-height:100%;overflow-y:scroll;scroll-behavior:smooth;scrollbar-gutter:stable}body{margin:0;padding-top:58px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);background:#07111ff5;backdrop-filter:blur(12px);display:flex;justify-content:flex-end}header a{color:var(--text);text-decoration:none;font-weight:850}header a:hover{color:var(--accent)}.wrap{width:min(850px,calc(100% - 28px));margin:32px auto 70px}.eyebrow{color:var(--accent);font-size:.76rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.top{margin-bottom:22px}.top h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:7px 0}.top p{color:var(--muted);margin:0;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions a{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;background:var(--panel)}.actions a:hover{border-color:var(--accent)}.legend{color:var(--muted);font-size:.82rem;margin:0 0 18px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 6px 0 2px}.dot.red{background:var(--red);margin-left:14px}.queue{display:flex;flex-direction:column;border-top:1px solid var(--line)}.error-state{padding:22px;border:1px solid var(--red);border-radius:14px;background:#2a1320;color:var(--text);line-height:1.6}.error-state p{color:var(--muted)}.error-state a{color:var(--accent)}.q{min-height:53px;display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;padding:0 10px;transition:background .12s}.q:hover{background:var(--panel2)}.q-number{display:inline-grid;place-items:center;width:42px;height:32px;border:1px solid #2b5d8a;border-radius:9px;background:#102a43;color:var(--accent);font-size:.95rem;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:.04em}.q-placeholder{min-width:0;color:#68819b;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.q-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px}.q-status{font-size:.65rem;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}.q-status.ann{color:var(--red)}.q-note{color:#7f96af;font-size:.65rem;white-space:nowrap;border:1px dashed #29445f;border-radius:999px;padding:4px 7px}@media(max-width:600px){header{padding:12px 14px}.wrap{width:calc(100% - 20px);margin-top:24px}.q{grid-template-columns:48px minmax(0,1fr) auto;gap:8px;padding:0 5px;min-height:49px}.q-number{width:39px;height:30px}.q-placeholder{font-size:.76rem}.q-note{display:none}.q-status{font-size:.58rem}}
html{scrollbar-width:auto;scrollbar-color:#2b5d8a #07111f}::-webkit-scrollbar{width:12px}::-webkit-scrollbar-track{background:#07111f}::-webkit-scrollbar-thumb{background:#2b5d8a;border:3px solid #07111f;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#62b5ff}</style></head><body><header><a href="./index.html" aria-label="Voltar à página inicial do Projeto Revalida">Projeto Revalida ↗</a></header><main class="wrap"><section class="top"><div class="eyebrow">Banco de Questões · <span id="ed"></span></div><h1>100 questões</h1><p>Selecione uma questão para abrir o enunciado e as alternativas. A área central está reservada para futuras tags de área, tema e subtema.</p><div class="actions"><a href="./treino_revalida.html">← Trocar edição</a><a href="#q01">Ir para questão 01 ↓</a></div></section><div class="legend"><span class="dot"></span>Disponível <span class="dot red"></span>Anulada</div><section id="queue" class="queue" aria-label="Lista de questões"></section></main>
<script src="./questoes.js"></script><script>
(()=>{const params=new URLSearchParams(location.search);const id=params.get("edicao")||"2025-1";const ed=id.replace("-","/");document.getElementById("ed").textContent=ed;const api=window.REVALIDA_DATA||{};const oficiais=api.gabaritosOficiais||(typeof gabaritosOficiais!=="undefined"?gabaritosOficiais:{});const preliminares=api.gabaritosPreliminares||(typeof gabaritosPreliminares!=="undefined"?gabaritosPreliminares:{});const gab=oficiais[ed]||preliminares[ed]||{};const data=Array.isArray(api.questoes)?api.questoes:(typeof questoes!=="undefined"&&Array.isArray(questoes)?questoes:[]);const byNumber=Object.fromEntries(data.filter(q=>q.edicao===ed).map(q=>[Number(q.numero),q]));const queue=document.getElementById("queue");if(!["2025/1","2025/2"].includes(ed)){queue.innerHTML='<p>Esta edição ainda não está disponível.</p>';return}if(!data.length){queue.innerHTML='<div class="error-state"><strong>Não foi possível carregar o banco de questões.</strong><p>O arquivo questoes.js não carregou ou contém um erro. Atualize a página; se o problema continuar, verifique o arquivo no repositório.</p><a href="./fase1.html">Voltar ao menu da Fase 1</a></div>';return}if(!data.some(q=>q.edicao===ed)){queue.innerHTML='<div class="error-state"><strong>Esta edição não possui questões importadas.</strong><p>Não exibiremos números vazios como se fossem questões disponíveis.</p><a href="./treino_revalida.html">Escolher outra edição</a></div>';return}queue.innerHTML=Array.from({length:100},(_,i)=>{const n=i+1,s=String(n).padStart(2,"0"),q=byNumber[n],g=q?.gabarito??gab[n],anulada=g==="-"||q?.anulada===true;return '<a id="q'+s+'" class="q" href="./questao.html?edicao='+id+'&numero='+s+'"><span class="q-number">'+s+'</span><span class="q-placeholder">Área · Tema · Subtema</span><span class="q-meta"><span class="q-status '+(anulada?'ann':'')+'">'+(anulada?'Anulada':'Disponível')+'</span><span class="q-note">Abrir →</span></span></a>'}).join("")})();
</script></body></html>
