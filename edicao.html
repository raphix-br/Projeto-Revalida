<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edição · Projeto Revalida</title><style>
:root{--bg:#07111f;--panel:#0d1b2e;--line:#1d3553;--text:#eef5ff;--muted:#8fa6c2;--accent:#4da3ff;--red:#ff667d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}header a{color:var(--text);text-decoration:none}.wrap{width:min(1100px,calc(100% - 36px));margin:45px auto}.eyebrow{color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.top h1{font-size:2.8rem;margin:8px 0}.top p{color:var(--muted);margin:0}.back{color:var(--accent);text-decoration:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.q{min-height:72px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);text-decoration:none;font-weight:800;transition:.15s}.q:hover{border-color:var(--accent);transform:translateY(-2px)}.q.ann{border-color:#713d49}.legend{color:var(--muted);font-size:.85rem;margin:18px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 6px}.dot.red{background:var(--red)}@media(max-width:750px){.grid{grid-template-columns:repeat(4,1fr)}.top{display:block}.back{display:inline-block;margin-top:15px}}@media(max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><a href="treino_revalida.html">← Edições</a><span>Banco de Questões</span></header><main class="wrap"><div class="top"><div><div class="eyebrow">Revalida <span id="ed"></span></div><h1>100 questões</h1><p>Selecione uma questão para abrir sua página individual.</p></div><a class="back" href="treino_revalida.html">Trocar edição</a></div><div class="legend"><span class="dot"></span>Questão disponível no banco <span class="dot red"></span>Questão anulada</div><div id="grid" class="grid"></div></main><script src="questoes.js"></script><script>
