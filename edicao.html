kground .12s}.q:hover{background:var(--panel2)}.q-number{display:inline-grid;place-items:center;width:42px;height:32px;border:1px solid #2b5d8a;border-radius:9px;background:#102a43;color:var(--accent);font-size:.95rem;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:.04em}.q-placeholder{min-width:0;color:#68819b;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.q-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px}.q-status{font-size:.65rem;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}.q-status.ann{color:var(--red)}.q-note{color:#7f96af;font-size:.65rem;white-space:nowrap;border:1px dashed #29445f;border-radius:999px;padding:4px 7px}@media(max-width:600px){header{padding:12px 14px}.wrap{width:calc(100% - 20px);margin-top:24px}.q{grid-template-columns:48px minmax(0,1fr) auto;gap:8px;padding:0 5px;min-height:49px}.q-number{width:39px;height:30px}.q-placeholder{font-size:.76rem}.q-note{display:none}.q-status{font-size:.58rem}}

9px 12px!important;min-height:62px!important}header.site-header .brand{font-size:.85rem!important;gap:8px!important}header.site-header .brand-mark{width:32px!important;height:32px!important}header.site-header .profile-button{padding:6px 8px!important;font-size:.73rem!important;gap:6px!important}header.site-header .soon{display:none!important}}</style></head><body><header class="site-header"><a class="brand" href="./index.html" aria-label="Ir para a página inicial"><span class="brand-mark">PJ</span><span>Plataforma Revalida <small>INEP</small></span></a><button class="profile-button" type="button" disabled aria-disabled="true" title="Autenticação será ativada futuramente"><span class="avatar">♙</span><span>Usuário</span><span class="soon">Em breve</span></button></header><main class="wrap"><section class="top"><div class="eyebrow">Banco de Questões · <span id="ed"></span></div><h1>100 questões</h1><p>Selecione uma questão para abrir o enunciado e as alternativas. A área central está reservada para futuras tags de área, tema e subtema.</p><div class="actions"><a href="./treino_revalida.html">← Trocar edição</a><a href="#q01">Ir para questão 01 ↓</a></div></section><div class="legend"><span class="dot"></span>Disponível <span class="dot red"></span>Anulada</div><section id="queue" class="queue" aria-label="Lista de questões"></section></main>
<script src="./questoes.js"></script><script>
(()=>{const params=new URLSearchParams(location.search);const id=params.get("edicao")||"2025-1";const ed=id.replace("-","/");document.getElementById("ed").textContent=ed;const api=window.REVALIDA_DATA||{};const oficiais=api.gabaritosOficiais||(typeof gabaritosOficiais!=="undefined"?gabaritosOficiais:{});const preliminares=api.gabaritosPreliminares||(typeof gabaritosPreliminares!=="undefined"?gabaritosPreliminares:{});const gab=oficiais[ed]||preliminares[ed]||{};const data=Array.isArray(api.questoes)?api.questoes:(typeof questoes!=="undefined"&&Array.isArray(questoes)?questoes:[]);const byNumber=Object.fromEntries(data.filter(q=>q.edicao===ed).map(q=>[Number(q.numero),q]));const queue=document.getElementById("queue");if(!["2025/1","2025/2"].includes(ed)){queue.innerHTML='<p>Esta edição ainda não está disponível.</p>';return}if(!data.length){queue.innerHTML='<div class="error-state"><strong>Não foi possível carregar o banco de questões.</strong><p>O arquivo questoes.js não carregou ou contém um erro. Atualize a página; se o problema continuar, verifique o arquivo no repositório.</p><a href="./fase1.html">Voltar ao menu da Fase 1</a></div>';return}if(!data.some(q=>q.edicao===ed)){queue.innerHTML='<div class="error-state"><strong>Esta edição não possui questões importadas.</strong><p>Não exibiremos números vazios como se fossem questões disponíveis.</p><a href="./treino_revalida.html">Escolher outra edição</a></div>';return}queue.innerHTML=Array.from({length:100},(_,i)=>{const n=i+1,s=String(n).padStart(2,"0"),q=byNumber[n],g=q?.gabarito??gab[n],anulada=g==="-"||q?.anulada===true;return '<a id="q'+s+'" class="q" href="./questao.html?edicao='+id+'&numero='+s+'"><span class="q-number">'+s+'</span><span class="q-placeholder">Área · Tema · Subtema</span><span class="q-meta"><span class="q-status '+(anulada?'ann':'')+'">'+(anulada?'Anulada':'Disponível')+'</span><span class="q-note">Abrir →</span></span></a>'}).join("")})();
</script></body></html>
