<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto Revalida — Banco de Questões</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#17212b}header{background:#1a2533;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center}header a{color:#fff}.toolbar{background:#fff;padding:14px;position:sticky;top:0;z-index:2;box-shadow:0 1px 5px #0001}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px}.lista{max-width:1000px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:10px;padding:16px;margin:10px 0;border-left:5px solid #3498db;cursor:pointer}.tag{display:inline-block;background:#eef5fb;color:#2876a8;padding:4px 8px;border-radius:999px;font-size:.8rem;margin:2px}.special{background:#fff3cd;color:#8a6500}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;padding:4vh 4vw}.box{background:#fff;max-width:1000px;height:92vh;margin:auto;border-radius:12px;overflow:auto;padding:28px;position:relative}.close{position:absolute;right:18px;top:12px;border:0;background:none;font-size:28px;cursor:pointer}.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid #ddd;border-radius:8px;background:#fff}.meta{color:#667085;font-size:.9rem}
</style>
</head>
<body>
<header><strong>Banco de Questões — Revalida INEP</strong><a href="index.html">Biblioteca</a></header>
<div class="toolbar">
<select id="edicao"></select><input id="busca" placeholder="Buscar por tema, área ou texto..." size="40"><span id="contador"></span>
</div>
<main id="lista" class="lista"></main>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="fechar()">×</button><div id="conteudo"></div></div></div>
<script src="questoes.js"></script>
<script>
const select=document.getElementById("edicao"),busca=document.getElementById("busca"),lista=document.getElementById("lista"),contador=document.getElementById("contador");
select.innerHTML='<option value="">Todas as edições</option>'+edicoes.map(e=>`<option value="${e.nome}">${e.nome}</option>`).join("");
const params=new URLSearchParams(location.search);select.value=params.get("edicao")?.replace("-","/")||"";
function filtrar(){
 const b=busca.value.toLowerCase().trim(),e=select.value;
 const xs=questoes.filter(q=>(!e||q.edicao===e)&&(!b||[q.text,q.tema,q.grupo,q.subgrupo,...q.tags].join(" ").toLowerCase().includes(b)));
 contador.textContent=`${xs.length} questões`;
 lista.innerHTML=xs.map(q=>`<article class="card" onclick="abrir('${q.id}')"><div><strong>Questão ${q.numero}</strong> · Revalida ${q.edicao}</div><div class="meta">${q.grupo} · ${q.subgrupo} · ${q.tema}</div><div>${q.tags.map(t=>`<span class="tag ${t==="anulada"?"special":""}">${t}</span>`).join("")}</div><p>${q.text}</p></article>`).join("")||"<p>Nenhuma questão encontrada.</p>";
}
function abrir(id){
 const q=questoes.find(x=>x.id===id);
 document.getElementById("conteudo").innerHTML=`<div class="meta">${q.id} · ${q.edicao} · ${q.tags.join(" · ")}</div><h2>Questão ${q.numero}</h2><p>${q.text}</p>${q.options.map(o=>`<button class="opt">${o}</button>`).join("")}<p class="meta">Gabarito armazenado no banco: <strong>${q.gabarito||"não informado"}</strong>. A validação contra o gabarito definitivo do INEP é controlada pelo status da edição.</p>`;
 document.getElementById("modal").style.display="block";
}
function fechar(){document.getElementById("modal").style.display="none"}
select.onchange=filtrar;busca.oninput=filtrar;filtrar();
</script>
</body>
</html>
