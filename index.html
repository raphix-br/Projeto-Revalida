<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeto Revalida — Biblioteca</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#17212b}header{padding:24px;text-align:center;background:#1a2533;color:#fff}main{max-width:1100px;margin:24px auto;padding:0 16px}.intro,.edicao{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}.intro{display:flex;justify-content:space-between;gap:16px;align-items:center}.intro h1{margin:0 0 6px}.btn{display:inline-block;padding:11px 16px;border:0;border-radius:8px;background:#0a9c6b;color:#fff;text-decoration:none;font-weight:bold}.grid{display:grid;gap:12px}.edicao{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center}.nome{font-weight:bold;font-size:1.15rem}.status{font-size:.92rem;color:#566}.pill{display:inline-block;margin:3px 5px 0 0;padding:4px 9px;border-radius:999px;background:#eef2f5}.ok{color:#18794e}.warn{color:#9a6700}.muted{color:#6b7280}@media(max-width:700px){.intro,.edicao{display:block}.btn{margin-top:12px}}
</style>
</head>
<body>
<header><h1>Projeto Revalida</h1><div>Biblioteca de provas — Banco de Questões INEP</div></header>
<main>
<section class="intro">
<div><h1>Biblioteca</h1><div id="resumo"></div></div>
<a class="btn" href="treino_revalida.html">Abrir banco de questões</a>
</section>
<div id="lista" class="grid"></div>
</main>
<script src="questoes.js"></script>
<script>
const qtdPorEdicao=Object.fromEntries(edicoes.map(e=>[e.id,questoes.filter(q=>q.edicao.replace("/","-")===e.id).length]));
const gabPorEdicao=Object.fromEntries(edicoes.map(e=>[e.id,questoes.filter(q=>q.edicao.replace("/","-")===e.id && q.gabarito).length]));
const resumo=document.getElementById("resumo");
resumo.textContent=`${questoes.length} questões importadas • ${edicoes.length} edições catalogadas • validação oficial ainda em andamento`;
document.getElementById("lista").innerHTML=edicoes.map(e=>{
 const n=qtdPorEdicao[e.id]||0,g=gabPorEdicao[e.id]||0;
 const qStatus=n===e.objetivasEsperadas?"🟢 completa":n?"🟡 parcial":"⚪ não iniciada";
 const gStatus=n===0?"⚪ não iniciado":g===n?"🟡 armazenado · não validado":"🟠 incompleto";
 return `<article class="edicao">
   <div class="nome">${e.nome}</div>
   <div class="status"><span class="pill">Questões: ${n}/${e.objetivasEsperadas} — ${qStatus}</span><span class="pill">Gabarito: ${g}/${n} — ${gStatus}</span></div>
   <div><a class="btn" href="treino_revalida.html?edicao=${e.id}">Ver</a></div>
 </article>`;
}).join("");
</script>
</body>
</html>
